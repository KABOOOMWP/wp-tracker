name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  android:
    name: Config, shared JVM and Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: App config
        working-directory: .
        run: |
          python3 tool/app_config.py check
          python3 -m unittest discover -s tool -v
      # The wrapper starts on this JDK; gradle-daemon-jvm.properties asks for 25
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Kotlin style and static analysis (ktlint, detekt)
        run: ./gradlew spotlessCheck detekt
      - name: Build-logic tests (release key, app.json parsing)
        run: ./gradlew :build-logic:test
      - name: Shared tests (JVM and Android host)
        run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest
      - name: Android unit tests
        run: ./gradlew :android:common:testDebugUnitTest :android:watch:testDebugUnitTest :android:phone:testDebugUnitTest
      - name: Coverage floors (Kover)
        run: ./gradlew koverVerify
      - name: Android lint
        run: ./gradlew :android:common:lintDebug :android:watch:lintDebug :android:phone:lintDebug
      # Shrinks both apps with the release rules; needs no signing key (only packaging does)
      - name: Release shrinking (R8)
        run: ./gradlew :android:watch:minifyReleaseWithR8 :android:phone:minifyReleaseWithR8
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: code/**/build/reports/

  apple:
    name: Shared native and Apple apps
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Swift style (SwiftLint)
        working-directory: .
        run: |
          command -v swiftlint || brew install swiftlint
          swiftlint lint --strict
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Shared tests (all targets)
        run: ./gradlew :shared:allTests
      - name: watchOS app tests
        run: |
          xcodebuild test -project apple/WPPadel.xcodeproj -scheme WPPadelTracker \
            -destination "id=$(python3 ../tool/simulator.py watchOS)" -enableCodeCoverage YES \
            -resultBundlePath build/WPPadelTracker.xcresult CODE_SIGNING_ALLOWED=NO
      - name: iPhone app tests
        run: |
          xcodebuild test -project apple/WPPadel.xcodeproj -scheme WPPadelBoard \
            -destination "id=$(python3 ../tool/simulator.py iOS)" -enableCodeCoverage YES \
            -resultBundlePath build/WPPadelBoard.xcresult CODE_SIGNING_ALLOWED=NO
      # Line floors just below the measured value (unit + UI tests); raise them when coverage grows
      - name: Coverage floors (xccov)
        run: |
          python3 ../tool/xccov_floor.py build/WPPadelTracker.xcresult WPPadelTracker.app 93
          python3 ../tool/xccov_floor.py build/WPPadelBoard.xcresult WPPadelBoard.app 94
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-results
          path: |
            code/build/*.xcresult
            code/shared/build/reports/
