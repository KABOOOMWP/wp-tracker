[versions]
android-compileSdk = "37"
android-targetSdk  = "37"
android-minSdk     = "26"
# JDK that compiles every JVM and Android target (read by build-logic)
jvm                = "21"
kotlin            = "2.4.21"
agp               = "9.4.1"
compose-bom       = "2026.09.00"
activity-compose  = "1.13.0"
lifecycle         = "2.9.4"
coroutines        = "1.11.0"
serialization     = "1.11.0"
play-services-wearable = "19.0.0"
androidx-core          = "1.18.0"
androidx-test          = "1.7.0"
espresso               = "3.7.0"
spotless          = "8.10.4"
ktlint            = "1.8.0"
detekt            = "2.0.0-alpha.6"
kover             = "0.9.11"

[libraries]
kotlin-test                  = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit            = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-serialization-json   = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# AndroidX test (the Compose test kit pulls in versions that crash on API 37)
androidx-test-core           = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner         = { module = "androidx.test:runner", version.ref = "androidx-test" }
espresso-core                = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Compose UI Testing
compose-ui-test-junit4       = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# Compose
compose-bom                  = { group = "androidx.compose",      name = "compose-bom",           version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui",   name = "ui" }
compose-ui-tooling           = { group = "androidx.compose.ui",   name = "ui-tooling" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui",   name = "ui-tooling-preview" }
compose-foundation           = { group = "androidx.compose.foundation", name = "foundation" }

# AndroidX
activity-compose             = { group = "androidx.activity",     name = "activity-compose",      version.ref = "activity-compose" }
lifecycle-viewmodel          = { group = "androidx.lifecycle",    name = "lifecycle-viewmodel",   version.ref = "lifecycle" }
androidx-core                = { group = "androidx.core",          name = "core",                  version.ref = "androidx-core" }
play-services-wearable       = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "play-services-wearable" }

# Coroutines
kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",    version.ref = "coroutines" }

# Gradle plugins that the convention plugins in build-logic compile against
android-gradlePlugin         = { module = "com.android.tools.build:gradle",                      version.ref = "agp" }
kotlin-gradlePlugin          = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin",           version.ref = "kotlin" }
compose-gradlePlugin         = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
spotless-gradlePlugin        = { module = "com.diffplug.spotless:spotless-plugin-gradle",        version.ref = "spotless" }
detekt-gradlePlugin          = { module = "dev.detekt:detekt-gradle-plugin",                     version.ref = "detekt" }
kover-gradlePlugin           = { module = "org.jetbrains.kotlinx:kover-gradle-plugin",           version.ref = "kover" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application                  = { id = "com.android.application",                    version.ref = "agp" }
android-library                      = { id = "com.android.library",                        version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library",   version.ref = "agp" }
spotless             = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt               = { id = "dev.detekt",            version.ref = "detekt" }
kover                = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

# Convention plugins (code/build-logic)
wppadel-root                 = { id = "wppadel.root" }
wppadel-android-application  = { id = "wppadel.android.application" }
wppadel-android-library      = { id = "wppadel.android.library" }
wppadel-kotlin-multiplatform = { id = "wppadel.kotlin.multiplatform" }
